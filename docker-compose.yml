version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eepsa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eepsa_user
      POSTGRES_PASSWORD: eepsa_password
      POSTGRES_DB: eepsa_catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${HOST_PATH:-.}/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Puertos eliminados para no chocar con bases de datos en Synology

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eepsa-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://eepsa_user:eepsa_password@db:5432/eepsa_catalog
      - PORT=3001
      # SINV = fuente única de productos, precios y stock. Llaves por canal seguro, nunca en git.
      # Local: SINV_BASE_URL=http://host.docker.internal:3000 (SINV corriendo en tu máquina)
      - SINV_BASE_URL=${SINV_BASE_URL:-}
      - SINV_API_KEY=${SINV_API_KEY:-}
      - SINV_HMAC_SECRET=${SINV_HMAC_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_PATH:-.}/assets/img:/app/public/img
    depends_on:
      - db
    # Puertos eliminados, solo accesible en red interna de Docker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eepsa-frontend
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=https://catalogo.eepsa.com.mx
    depends_on:
      - backend
    # Puertos eliminados (no expone el puerto 80 hacia el Synology)

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: eepsa-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend

  github-runner:
    image: myoung34/github-runner:latest
    container_name: eepsa-github-runner
    restart: unless-stopped
    environment:
      - REPO_URL=${GITHUB_REPO_URL}
      - RUNNER_NAME=synology-nas-runner
      # Preferir ACCESS_TOKEN (PAT con permiso de administración del repo): el runner pide un
      # token de registro nuevo en cada arranque. El RUNNER_TOKEN caduca en 1 hora, así que tras
      # reiniciar el NAS/contenedor el runner no vuelve a registrarse y los deploys se quedan en cola.
      - ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN:-}
      - RUNNER_TOKEN=${GITHUB_RUNNER_TOKEN:-}
      - RUNNER_SCOPE=repo
      # Reusar el registro tras un reinicio del contenedor/NAS. Sin esto, al reiniciar encontraba
      # su configuración vieja ("already configured"), fallaba y quedaba en bucle de reinicios
      # (pasó del 16-sep al 3-oct-2026: 18,681 reinicios, ningún deploy se ejecutó).
      - CONFIGURED_ACTIONS_RUNNER_FILES_DIR=/runner-config
      - DISABLE_AUTOMATIC_DEREGISTRATION=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PATH:-.}/:/opt/actions-runner/_work/CatalogoEepsa/CatalogoEepsa
      - runner_config:/runner-config

volumes:
  postgres_data:
  runner_config:
